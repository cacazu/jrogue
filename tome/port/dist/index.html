<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ToME</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="app" aria-busy="true">
  <header><h1 data-text="ui.title"></h1><p data-text="app.scope" class="scope"></p></header>
  <div class="toolbar"><label><span data-text="ui.language"></span><select id="locale"><option value="ja" data-text="ui.japanese"></option><option value="en" data-text="ui.english"></option></select></label><label><span data-text="ui.seed"></span><input id="seed" type="number" min="0" max="4294967295" value="42"></label><button id="reset" data-text="ui.reset"></button></div>
  <div class="identity"><label><span data-text="ui.name"></span><input id="name" maxlength="80" value="探索者" autocomplete="off"></label><button id="apply-name" data-text="ui.apply_name"></button></div>
  <section class="workbench" aria-labelledby="results-title">
    <div class="results"><h2 id="results-title" data-text="ui.results"></h2><dl id="formula"></dl><dl id="counters"></dl></div>
    <div class="actions"><button class="primary" id="strike" data-text="ui.strike"></button><button id="tick" data-text="ui.tick"></button></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <section aria-labelledby="parameters-title"><h2 id="parameters-title" data-text="ui.parameters"></h2><form id="parameters"><div id="fields" class="fields"></div><button type="submit" data-text="ui.configure"></button></form></section>
  <section aria-labelledby="log-title"><h2 id="log-title" data-text="ui.log"></h2><ol id="log" aria-live="off"></ol></section>
  <div class="storage"><button id="save" data-text="ui.save"></button><button id="load" data-text="ui.load"></button><button id="export" data-text="ui.export"></button><label class="file-label"><span data-text="ui.import"></span><input id="import" type="file" accept=".json,application/json"></label></div>
  <p class="help" data-text="ui.help"></p>
</main><script type="module" src="app.js"></script>
</body></html>
