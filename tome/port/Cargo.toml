[workspace]
resolver = "3"
members = ["crates/logic", "crates/input", "crates/presentation", "crates/platform"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
