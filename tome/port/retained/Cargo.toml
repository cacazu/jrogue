[workspace]
resolver = "3"
members = ["contracts", "input", "display", "environment"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tome-core-contracts = { path = "contracts" }
tome-core-input = { path = "input" }
tome-core-display = { path = "display" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
