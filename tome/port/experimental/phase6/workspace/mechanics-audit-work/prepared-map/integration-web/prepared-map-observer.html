<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToME</title>
<style>
body{margin:0;background:#17191d;color:#eee;font:16px system-ui,sans-serif;line-height:1.6}
main{max-width:1280px;margin:auto;padding:16px}h1{font-size:1.2rem}
canvas{display:block;width:100%;height:auto;background:#000;border:1px solid #555;pointer-events:none}
p,pre{overflow-wrap:anywhere}pre{white-space:pre-wrap;font:13px ui-monospace,monospace;max-height:28rem;overflow:auto}
</style>
<main>
<h1 data-text="observer.ui.title"></h1><p data-text="observer.ui.scope"></p>
<canvas id="game" width="1280" height="720" inert aria-label="ToME"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<details><summary data-text="observer.ui.diagnostics"></summary><pre id="log"></pre></details>
</main>
<script type="module" src="/observer/observer.mjs"></script>
</html>
