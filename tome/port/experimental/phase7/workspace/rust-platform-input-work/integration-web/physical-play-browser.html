<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToME</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15171b;color:#eee;font:16px system-ui,sans-serif;line-height:1.5}
main{max-width:1280px;margin:auto;padding:12px;overflow-wrap:anywhere}h1{font-size:1.2rem;margin:0 0 8px}
canvas{display:block;width:100%;height:auto;background:#000;border:1px solid #566171;touch-action:none}
button,a{font:inherit}button{min-width:48px;min-height:48px;padding:8px 10px;background:#303744;color:#fff;border:1px solid #77869d;border-radius:4px;overflow-wrap:anywhere}
button:disabled{opacity:.5}button:focus-visible,a:focus-visible,canvas:focus-visible,summary:focus-visible{outline:3px solid #8ce0ff;outline-offset:2px}
a{color:#a9ddff}.hud,.actions{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}.hud{margin:8px 0}.hud p{margin:0}
.controls{display:grid;grid-template-columns:repeat(3,minmax(48px,1fr));gap:6px;max-width:440px;margin:12px auto}.controls button{min-height:56px}
.actions{justify-content:center;margin:8px 0}.details-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
details{margin-top:16px;border-top:1px solid #566171;padding-top:10px}summary{cursor:pointer}
pre{font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:13rem;overflow:auto;border:1px solid #566171;padding:8px}
[role=dialog]{padding:16px;border:2px solid #77869d;border-radius:6px;margin:12px 0;background:#202732}
[role=dialog] h2{font-size:1.2rem;margin-top:0}[role=dialog] button{margin:4px 8px 4px 0}
@media(max-width:600px){main{padding:8px}.controls{max-width:100%}.controls button{font-size:.875rem;padding:6px}h1{font-size:1rem}}
</style>
<main id="play">
<h1 data-text-id="ui.core.title">ToME</h1>
<p data-tome-status role="status" aria-live="polite"></p>
<canvas id="original" width="1280" height="720" tabindex="0"></canvas>
<div class="hud">
<p><strong data-tome-field="name"></strong></p>
<p><span data-text-id="ui.core.life"></span>: <span data-tome-field="life"></span> / <span data-tome-field="max_life"></span></p>
<p><span data-text-id="ui.core.level"></span>: <span data-tome-field="level"></span></p>
<p><span data-text-id="ui.core.turn"></span>: <span data-tome-field="turn"></span></p>
</div>
<div class="controls">
<button data-tome-command="MOVE_LEFT_UP" data-text-id="ui.core.left_up" disabled></button>
<button data-tome-command="MOVE_UP" data-text-id="ui.core.up" disabled></button>
<button data-tome-command="MOVE_RIGHT_UP" data-text-id="ui.core.right_up" disabled></button>
<button data-tome-command="MOVE_LEFT" data-text-id="ui.core.left" disabled></button>
<button data-tome-command="MOVE_STAY" data-text-id="ui.core.wait" disabled></button>
<button data-tome-command="MOVE_RIGHT" data-text-id="ui.core.right" disabled></button>
<button data-tome-command="MOVE_LEFT_DOWN" data-text-id="ui.core.left_down" disabled></button>
<button data-tome-command="MOVE_DOWN" data-text-id="ui.core.down" disabled></button>
<button data-tome-command="MOVE_RIGHT_DOWN" data-text-id="ui.core.right_down" disabled></button>
</div>
<div class="actions"><button id="save" data-save-text-id="save.ui.save" disabled></button><a id="resume-comparison" href="/semantic-resume.html" data-save-text-id="save.ui.resume_button" hidden></a><span id="save-status" role="status" aria-live="polite"></span></div>
<div data-tome-dialogs></div>
<p data-physical-text-id="input.ui.scope"></p>
<div id="physical-text-row" hidden><label for="physical-text" data-physical-text-id="input.ui.text_input"></label>
<textarea id="physical-text" rows="2" autocomplete="off" spellcheck="false"></textarea>
<span data-physical-text-id="input.ui.preedit"></span><output id="physical-preedit"></output></div>
<button id="physical-focus" data-physical-text-id="input.ui.focus_canvas"></button>
<details>
<summary data-save-text-id="save.ui.diagnostics"></summary>
<p id="projection-scope" data-text-id="ui.core.diagnostic"></p>
<p data-text-id="ui.core.help"></p>
<div class="details-controls" role="group" aria-describedby="projection-scope">
<span data-text-id="ui.core.language"></span>
<button data-tome-locale="ja" data-text-id="ui.core.japanese"></button>
<button data-tome-locale="en" data-text-id="ui.core.english"></button>
<button data-tome-op="snapshot" data-text-id="ui.core.refresh" disabled></button>
</div>
<p data-text-id="ui.core.save_boundary"></p>
<p data-save-text-id="save.ui.scope"></p>
<pre id="diagnostics"></pre><pre id="log"></pre>
</details>
</main>
<script type="module" src="/physical-play-browser.mjs"></script>
</html>
