[package]
name = "tome-text-wasm"
version = "1.7.6"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Safe presentation-only WASM mailbox for the retained ToME semantic resolver"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tome-text-kernel = { path = ".." }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
