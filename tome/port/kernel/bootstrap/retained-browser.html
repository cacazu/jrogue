<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToME</title>
<style>
body{margin:0;background:#15171b;color:#eee;font:16px system-ui,sans-serif;line-height:1.5}
main{max-width:1280px;margin:auto;padding:12px;overflow-wrap:anywhere}
h1{font-size:1.2rem}canvas{width:100%;height:auto;display:block;background:black;touch-action:none}
button{min-width:48px;min-height:48px;font:inherit;padding:8px;background:#303744;color:white;border:1px solid #777;border-radius:4px}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}dl{display:flex;flex-wrap:wrap;gap:8px 16px}dt,dd{margin:0}
</style>
<main id="diagnostic">
<h1 data-text-id="ui.core.title"></h1>
<p data-text-id="ui.core.diagnostic"></p>
<p data-tome-status role="status"></p>
<canvas id="original" width="1280" height="720" tabindex="0"></canvas>
<dl>
<dt data-text-id="ui.core.level"></dt><dd data-tome-field="level"></dd>
<dt data-text-id="ui.core.life"></dt><dd data-tome-field="life"></dd>
<dt data-text-id="ui.core.max_life"></dt><dd data-tome-field="max_life"></dd>
<dt data-text-id="ui.core.turn"></dt><dd data-tome-field="turn"></dd>
<dt data-text-id="ui.core.energy"></dt><dd data-tome-field="energy"></dd>
<dd data-tome-field="name"></dd>
</dl>
<div class="controls">
<button data-tome-command="MOVE_LEFT_UP" data-text-id="ui.core.left_up" disabled></button>
<button data-tome-command="MOVE_UP" data-text-id="ui.core.up" disabled></button>
<button data-tome-command="MOVE_RIGHT_UP" data-text-id="ui.core.right_up" disabled></button>
<button data-tome-command="MOVE_LEFT" data-text-id="ui.core.left" disabled></button>
<button data-tome-command="MOVE_STAY" data-text-id="ui.core.wait" disabled></button>
<button data-tome-command="MOVE_RIGHT" data-text-id="ui.core.right" disabled></button>
<button data-tome-command="MOVE_LEFT_DOWN" data-text-id="ui.core.left_down" disabled></button>
<button data-tome-command="MOVE_DOWN" data-text-id="ui.core.down" disabled></button>
<button data-tome-command="MOVE_RIGHT_DOWN" data-text-id="ui.core.right_down" disabled></button>
</div>
<div class="controls">
<button data-tome-op="snapshot" data-text-id="ui.core.refresh"></button>
<button data-tome-locale="ja" data-text-id="ui.core.japanese"></button>
<button data-tome-locale="en" data-text-id="ui.core.english"></button>
</div>
<p data-text-id="ui.core.help"></p><p data-text-id="ui.core.save_boundary"></p>
<div data-tome-dialogs></div>
</main>
<script type="module">
import nativeFactory from '/native/tome-native.mjs';
import {mountOriginalInputs} from '/bootstrap/browser_vfs_mounts.mjs';
import {createRetainedBrowserSession} from '/rust/retained-browser-session.mjs';
import {renderDiagnostic} from '/rust/diagnostic-renderer.mjs';
const root=document.querySelector('#diagnostic'),canvas=document.querySelector('#original');
const report=window.tomeNativeBootReport={completed:false,passed:false,phase:'rust-factory',
  scope:'Actual retained C/Lua with Rust input/display/environment diagnostic seam',
  completeGameUi:false,contentJapaneseIntegrated:false,renderer:'original-effectful-baseline-plus-pure-Rust-status'};
let vfs,session,lastPresentation;
const calls={};
function present(value){lastPresentation=value;renderDiagnostic(root,value);document.title=value.labels['ui.core.title'];canvas.setAttribute('aria-label',value.labels['ui.core.title']);}
try{
  const response=await fetch('/retained/tome_core_environment.wasm');
  if(!response.ok)throw Error('Retained Rust WASM request failed');
  const rustWasmBytes=await response.arrayBuffer();
  session=await createRetainedBrowserSession({nativeFactory,canvas,rustWasmBytes,
    locateFile:name=>'/native/'+name,onPresentation:present,
    nativeOptions:{print:line=>console.log(String(line).slice(0,8192)),printErr:line=>console.error(String(line).slice(0,8192))},
    mountBeforeInit:async module=>{vfs=await mountOriginalInputs(module);const original=module.ccall.bind(module);
      module.ccall=(name,...args)=>{calls[name]=(calls[name]||0)+1;return original(name,...args);};}
  });
  await session.start();
  if(session.failure||session.phase!=='ready')throw session.failure||Error('Original core did not reach its input boundary');
  const native=session.original.module;
  function raw(){return JSON.parse(native.ccall('tome_native_snapshot','string',[],[]));}
  function rng(){return native.ccall('tome_native_rng_snapshot_hex','string',[],[]);}
  function draw(){if(native.ccall('tome_native_draw_baseline','number',[],[])!==1)throw Error(session.original.nativeError('error.core.failed','baseline draw'));}
  draw(); // Explicit original comparison draw; production Rust world rendering remains incomplete.
  await session.dispatch({op:'snapshot'}).completion;
  // Application preparation after an accepted ORIGINAL command. This retained
  // baseline draw remains effectful; pure Rust view/locale requests never call
  // it. Read the resulting original observation again before presenting it.
  const dispatch=session.dispatch.bind(session);
  session.dispatch=request=>{
    const result=dispatch(request);
    if(result.immediate.pending_kind===2)result.completion=result.completion.then(async value=>{
      if(value.error_id||session.failure)return value;
      draw();return dispatch({op:'snapshot'}).completion;
    });
    return result;
  };
  session.bindControls({keyTarget:window,controlsRoot:root,ownHandledInput:true});
  const pure=async()=>{
    const before=raw(),beforeRng=rng(),beforeCalls={...calls};
    for(let n=0;n<5;n++){await session.dispatch({op:'view'}).completion;await session.dispatch({op:'locale',locale:n%2?'en':'ja'}).completion;}
    const afterCalls={...calls};const after=raw(),afterRng=rng();
    return {passed:JSON.stringify(before)===JSON.stringify(after)&&beforeRng===afterRng&&JSON.stringify(beforeCalls)===JSON.stringify(afterCalls),
      nativeCallsDuringPureRendering:Object.entries(afterCalls).filter(([name,count])=>count!==(beforeCalls[name]||0)),
      rngBytes:beforeRng.length/2,completeGameRenderer:false};
  };
  window.tomeRetainedProbe={raw,rng,calls:()=>({...calls}),presentation:()=>structuredClone(lastPresentation),
    command:async id=>{await session.dispatch({op:'touch',key:id}).completion;return {presentation:structuredClone(lastPresentation),native:raw(),calls:{...calls}};},
    pure,drawBaseline:draw,refresh:()=>session.dispatch({op:'snapshot'}).completion,report};
  const state=raw();report.snapshot={ready:state.ready,turn:state.game?.turn,player:state.game?.player,
    map:{w:state.game?.level?.map?.w,h:state.game?.level?.map?.h,cells:state.game?.level?.map?.cells?.length}};
  report.passed=state.ready===true&&Number.isFinite(state.game?.player?.uid);
  report.metrics={...vfs.metrics};report.sourceCommit=vfs.manifest.upstream_commit;
  report.calls={...calls};report.phase='real-player-ready';report.completed=true;canvas.focus();
}catch(error){report.completed=true;report.passed=false;report.error=error.stack||String(error);console.error('TOME_RETAINED_BROWSER_FAILURE='+report.error);}
</script>
</html>
