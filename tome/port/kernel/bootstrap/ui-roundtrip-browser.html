<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToME</title>
<style>
body{margin:0;background:#15171b;color:#eee;font:16px system-ui,sans-serif;line-height:1.5}
main{max-width:1280px;margin:auto;padding:12px;overflow-wrap:anywhere;box-sizing:border-box}
h1{font-size:1.2rem}canvas{display:block;width:100%;height:auto;max-height:30vh;object-fit:contain;background:black;touch-action:none}
button{min-width:48px;min-height:48px;max-width:100%;font:inherit;padding:8px 14px;background:#303744;color:white;border:1px solid #777;border-radius:4px;overflow-wrap:anywhere}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button:focus-visible{outline:3px solid #8ce0ff;outline-offset:2px}
[role=dialog]{padding:16px;border:2px solid #77869d;border-radius:6px;margin:12px 0;background:#202732;box-sizing:border-box}
[role=dialog] h2{font-size:1.2rem;margin-top:0}[role=dialog] button{margin:4px 8px 4px 0}
</style>
<main id="diagnostic">
<h1 data-text-id="ui.core.title"></h1>
<p data-text-id="ui.core.diagnostic"></p><p data-tome-status role="status"></p>
<canvas id="original" width="1280" height="720" tabindex="0"></canvas>
<p><span data-tome-field="name"></span></p>
<div class="controls">
<button id="open-original" data-text-id="ui.dialog.accept" disabled></button>
<button data-tome-locale="ja" data-text-id="ui.core.japanese"></button>
<button data-tome-locale="en" data-text-id="ui.core.english"></button>
</div>
<div data-tome-dialogs></div>
</main>
<script type="module">
import nativeFactory from '/native/tome-native.mjs';
import {mountOriginalInputs} from '/bootstrap/browser_vfs_mounts.mjs';
import {createRetainedBrowserSession} from '/rust/retained-browser-session.mjs';
import {renderDiagnostic} from '/rust/diagnostic-renderer.mjs';

const root=document.querySelector('#diagnostic'),canvas=document.querySelector('#original');
const report=window.tomeNativeBootReport={completed:false,passed:false,phase:'ui-factory',
  scope:'One genuine original yesnoPopup projected and dispatched through Rust',
  completeGameUi:false,renderer:'original-effectful-background-plus-Rust-dialog-projection'};
const nativeCalls={},pendingCalls={};
let session,native,vfs,lastPresentation,busy=false,lastCompletion=Promise.resolve(),lastGate=null;
const copy=value=>structuredClone(value);
const fail=message=>{throw Error(message);};
function present(value){
  lastPresentation=value;renderDiagnostic(root,value);
  document.title=value.labels['ui.core.title'];canvas.setAttribute('aria-label',document.title);
  const active=Boolean(value.ui?.dialogs.length);
  document.querySelector('#open-original').disabled=busy||active||value.pending_kind!==0||value.phase!=='ready';
  if(busy)for(const button of root.querySelectorAll('[data-tome-ui-key]'))button.disabled=true;
}
// The Rust capture handler owns this diagnostic input path. No SDL event drain
// or simulation loop runs alongside it. Opening/waiting never changes a key gate.
window.addEventListener('keydown',event=>{
  if(busy&&['Enter','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){
    event.preventDefault();event.stopImmediatePropagation();
  }
},{capture:true});
root.addEventListener('click',event=>{
  if(busy&&event.target.closest?.('[data-tome-ui-key]')){event.preventDefault();event.stopImmediatePropagation();}
},{capture:true});

function json(name,types=[],args=[],errorExport='tome_native_ui_roundtrip_last_error'){
  const text=native.ccall(name,'string',types,args); // ccall copies the borrowed C string now.
  if(typeof text!=='string'||!text.length)fail(native.ccall(errorExport,'string',[],[])||name+' failed');
  return JSON.parse(text);
}
const raw=()=>json('tome_native_snapshot',[],[],'tome_native_last_error');
const uiRaw=()=>json('tome_native_ui_snapshot',[],[],'tome_native_ui_last_error');
const rng=()=>native.ccall('tome_native_rng_snapshot_hex','string',[],[]);
const status=()=>json('tome_native_ui_roundtrip_status');
const clock=()=>{
  const value=native.ccall('tome_native_ui_clock_ms','number',[],[]);
  if(!Number.isFinite(value)||value<0)fail('Actual original SDL clock is invalid');return value;
};
async function refreshUi(){
  const answer=await session.dispatch({op:'ui_snapshot'}).completion;
  if(answer.error_id||session.failure)fail(answer.error_id||String(session.failure));return answer;
}
async function waitOriginalGate(snapshot){
  const top=snapshot.stack.at(-1);
  const observed=[top?.input_blocked_until,...(top?.components||[]).map(component=>component.input_blocked_until)]
    .filter(value=>value!==undefined&&value!==null);
  if(observed.some(value=>!Number.isFinite(value)||value<0))fail('Original input deadline is invalid');
  const deadline=observed.length?Math.max(...observed):null,start=clock(),wallStart=performance.now();
  let current=start;
  while(deadline!==null&&current<deadline){
    if(performance.now()-wallStart>10000)fail('Original input deadline exceeds this bounded diagnostic wait');
    await new Promise(resolve=>setTimeout(resolve,Math.min(100,Math.max(1,deadline-current))));
    current=clock();
  }
  return {observed_deadlines:observed,deadline,original_clock_start_ms:start,original_clock_end_ms:current,
    natural_wait_ms:performance.now()-wallStart,gate_observed:observed.length>0,
    scope:'Read actual SDL clock; await natural time; original isEnabled remains authoritative at the one input dispatch'};
}
async function open(locale='ja'){
  if(busy||lastPresentation.pending_kind!==0)fail('An original UI operation is in flight');
  busy=true;present(lastPresentation);
  try{
    const opened=json('tome_native_ui_roundtrip_open',['string'],[locale]);
    await refreshUi();lastGate=await waitOriginalGate(uiRaw());
    return {status:opened,ui:uiRaw(),presentation:copy(lastPresentation),gate:copy(lastGate)};
  }finally{busy=false;present(lastPresentation);}
}
async function command(command){
  if(busy)fail('Original UI input is still gated by an operation');
  const answer=await session.dispatch({op:'ui',command}).completion;
  return {presentation:copy(answer),status:status(),ui:uiRaw(),calls:{...nativeCalls}};
}
async function purity(){
  const beforeState=JSON.stringify(raw()),beforeRng=rng(),beforeUi=JSON.stringify(uiRaw()),beforeStatus=JSON.stringify(status());
  let queryPure=true;
  for(let i=0;i<8;i++)if(JSON.stringify(uiRaw())!==beforeUi||JSON.stringify(status())!==beforeStatus)queryPure=false;
  const queryState=JSON.stringify(raw()),queryRng=rng();
  const beforeCalls={...nativeCalls};
  for(let i=0;i<4;i++){
    await session.dispatch({op:'view'}).completion;
    await session.dispatch({op:'locale',locale:i%2?'ja':'en'}).completion;
  }
  const afterCalls={...nativeCalls},afterState=JSON.stringify(raw()),afterRng=rng();
  return {passed:queryPure&&beforeState===queryState&&beforeRng===queryRng&&
      beforeState===afterState&&beforeRng===afterRng&&JSON.stringify(beforeCalls)===JSON.stringify(afterCalls),
    repeated_native_ui_query_pure:queryPure,original_state_preserved:beforeState===queryState&&beforeState===afterState,
    combined_rng_preserved:beforeRng===queryRng&&beforeRng===afterRng,pure_rust_locale_zero_native_calls:JSON.stringify(beforeCalls)===JSON.stringify(afterCalls),
    native_calls_during_rust_render:Object.entries(afterCalls).filter(([name,count])=>count!==(beforeCalls[name]||0)),
    ui_before:JSON.parse(beforeUi),status_before:JSON.parse(beforeStatus),rng_hex_characters:beforeRng.length};
}
try{
  const response=await fetch('/retained/tome_core_environment.wasm');
  if(!response.ok)fail('Retained Rust WASM request failed');
  const rustWasmBytes=await response.arrayBuffer();
  session=await createRetainedBrowserSession({nativeFactory,canvas,rustWasmBytes,onPresentation:present,
    locateFile:name=>'/native/'+name,
    nativeOptions:{print:line=>console.log(String(line).slice(0,8192)),printErr:line=>console.error(String(line).slice(0,8192))},
    mountBeforeInit:async module=>{
      vfs=await mountOriginalInputs(module);const original=module.ccall.bind(module);
      module.ccall=(name,...args)=>{nativeCalls[name]=(nativeCalls[name]||0)+1;return original(name,...args);};
    }});
  const originalDispatch=session.dispatch.bind(session);
  session.dispatch=request=>{
    const result=originalDispatch(request),kind=result.immediate.pending_kind;
    pendingCalls[kind]=(pendingCalls[kind]||0)+1;
    lastCompletion=result.completion;return result;
  };
  await session.start();
  if(session.failure||session.phase!=='ready')fail(String(session.failure||'Actual original birth did not reach readiness'));
  native=session.original.module;
  for(const name of ['install','open','status','verify_closed','verify_stale','last_error']){
    if(typeof native['_tome_native_ui_roundtrip_'+name]!=='function')fail('Required actual roundtrip export is absent: '+name);
  }
  if(typeof native._tome_native_ui_clock_ms!=='function')fail('Actual original SDL clock export is absent');
  report.install=json('tome_native_ui_roundtrip_install');
  const state=raw(),initialUi=uiRaw();
  if(state.ready!==true||!Number.isFinite(state.game?.player?.uid)||initialUi.stack.length!==0)fail('Actual original birth/empty dialog stack required');
  if(typeof native._tome_native_draw_baseline==='function'){
    if(native.ccall('tome_native_draw_baseline','number',[],[])!==1)fail('Actual original background draw failed');
  }
  await session.dispatch({op:'snapshot'}).completion;
  session.bindControls({keyTarget:window,controlsRoot:root,ownHandledInput:true});
  document.querySelector('#open-original').addEventListener('click',()=>{
    open(lastPresentation.locale).catch(error=>{report.ui_error=error.stack||String(error);console.error(report.ui_error);});
  });
  window.tomeUiRoundtripProbe={raw,uiRaw,rng,status,open,command,purity,
    presentation:()=>copy(lastPresentation),calls:()=>({...nativeCalls}),pendingCalls:()=>({...pendingCalls}),
    settled:async()=>{await lastCompletion;return copy(lastPresentation);},
    locale:async locale=>{const value=await session.dispatch({op:'locale',locale}).completion;return copy(value);},
    verifyClosed:expected=>json('tome_native_ui_roundtrip_verify_closed',['string'],[expected]),
    verifyStale:()=>json('tome_native_ui_roundtrip_verify_stale'),gate:()=>copy(lastGate),report};
  report.snapshot={ready:state.ready,turn:state.game.turn,player:state.game.player,
    map:{w:state.game.level.map.w,h:state.game.level.map.h}};
  report.sourceCommit=vfs.manifest.upstream_commit;report.metrics={...vfs.metrics};
  report.passed=true;report.completed=true;report.phase='real-player-original-ui-ready';canvas.focus();
}catch(error){report.completed=true;report.passed=false;report.error=error.stack||String(error);console.error('TOME_UI_ROUNDTRIP_FAILURE='+report.error);}
</script>
</html>
