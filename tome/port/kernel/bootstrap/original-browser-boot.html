<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToME 原版コア起動検証</title>
<style>
  body{margin:0;background:#15171b;color:#eee;font:16px system-ui,sans-serif;line-height:1.5}
  main{max-width:1280px;margin:auto;padding:12px} h1{font-size:1.15rem;margin:0 0 8px}
  canvas{width:100%;height:auto;display:block;background:black;border:1px solid #555;touch-action:none}
  #status{white-space:pre-wrap;overflow-wrap:anywhere} #controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  button{min-width:48px;min-height:48px;font:inherit;background:#303744;color:white;border:1px solid #777;border-radius:4px}
  #log{max-height:12rem;overflow:auto;white-space:pre-wrap;font:12px ui-monospace,monospace}
</style>
<main>
<h1>ToME 原版 C/Lua コア起動検証</h1>
<p>原版のソース、フォント、画像を読み込みます。この画面は起動と入力の検証用です。</p>
<canvas id="game" width="1280" height="720" tabindex="0" aria-label="原版 ToME 描画領域"></canvas>
<p id="status" role="status">ソースを準備中…</p>
<div id="controls" aria-label="移動入力">
<button data-command="MOVE_LEFT_UP">↖</button><button data-command="MOVE_UP">↑</button><button data-command="MOVE_RIGHT_UP">↗</button>
<button data-command="MOVE_LEFT">←</button><button data-command="MOVE_STAY">待機</button><button data-command="MOVE_RIGHT">→</button>
<button data-command="MOVE_LEFT_DOWN">↙</button><button data-command="MOVE_DOWN">↓</button><button data-command="MOVE_RIGHT_DOWN">↘</button>
</div>
<pre id="log" aria-label="起動記録"></pre>
</main>
<script type="module">
import nativeFactory from '/native/tome-native.mjs';
import {mountOriginalInputs} from '/bootstrap/browser_vfs_mounts.mjs';
const canvas=document.querySelector('#game'), status=document.querySelector('#status'), log=document.querySelector('#log');
const report=window.tomeNativeBootReport={completed:false,passed:false,phase:'factory',commandDispatchCount:0,commandCount:0,scope:'Actual retained original C/Lua bootstrap characterization'};
let module, vfs, busy=false;
const summaries=[];
function summary(value) {
  const player=value?.game?.player, level=value?.game?.level;
  return {protocol:value?.protocol,ready:value?.ready,turn:value?.game?.turn,
    player:player&&{uid:player.uid,name:player.name,x:player.x,y:player.y,level:player.level,life:player.life},
    map:level?.map&&{w:level.map.w,h:level.map.h,cells:level.map.cells?.length}};
}
function print(line) {
  const text=String(line), match=text.match(/^(TOME_REAL_(?:BIRTH|BOOT)_JSON)=(.*)$/);
  const visible=match?`${match[1]}_SUMMARY=${JSON.stringify(summary(JSON.parse(match[2])))}`:text;
  console.log(visible); summaries.push(visible);
  if (summaries.length>80) summaries.shift();
  log.textContent=summaries.join('\n');
}
function nativeError() { return module.ccall('tome_native_last_error','string',[],[]); }
function snapshot() {
  const value=module.ccall('tome_native_snapshot','string',[],[]);
  if (!value) throw new Error(nativeError());
  return JSON.parse(value);
}
function drawOriginalBaseline() {
  if (typeof module._tome_native_draw_baseline!=='function') return {available:false,renderer:'unavailable'};
  if (module.ccall('tome_native_draw_baseline','number',[],[])!==1) throw new Error(nativeError());
  report.renderer='original-effectful-baseline';
  report.metrics={...vfs.metrics};
  return {available:true,renderer:report.renderer,metrics:{...vfs.metrics}};
}
function rngSnapshot() {
  if (typeof module?._tome_native_rng_snapshot_hex!=='function') throw new Error('Actual native RNG snapshot export is unavailable');
  const value=module.ccall('tome_native_rng_snapshot_hex','string',[],[]);
  if (!value) throw new Error(nativeError());
  if (!/^[0-9a-f]{5176}$/.test(value)) throw new Error('Actual combined native RNG snapshot has an unexpected envelope');
  return value; // ccall copied the borrowed native buffer; no RNG restore is exposed.
}
function persistPath(value) {
  if (typeof value!=='string'||!value.startsWith('/persist/')||value.includes('\\')||value.includes('\0')||
      value.slice(1).split('/').some(part=>part==='.'||part==='..'||part==='')) {
    throw new Error('Save inspection requires an exact regular path beneath /persist');
  }
  let current='';
  for (const component of value.slice(1).split('/')) {
    current+='/'+component;
    if (module.FS.isLink(module.FS.lstat(current).mode)) throw new Error('Save inspection does not follow symlinks');
  }
  return value;
}
function base64(bytes) {
  const parts=[];
  for (let i=0;i<bytes.length;i+=16384) parts.push(String.fromCharCode(...bytes.subarray(i,i+16384)));
  return btoa(parts.join(''));
}
function saveFile(path) {
  const safe=persistPath(path), before=module.FS.stat(safe);
  if (!module.FS.isFile(before.mode)) throw new Error('Save export requires an actual regular file');
  const bytes=module.FS.readFile(safe,{encoding:'binary'}), after=module.FS.stat(safe);
  if (bytes.length!==before.size||after.size!==before.size||Number(after.mtime)!==Number(before.mtime)) {
    throw new Error('Actual save file changed during read-only export');
  }
  return {path:safe,bytes:bytes.length,mtime_ms:Number(after.mtime),encoding:'base64',data:base64(bytes)};
}
function saveFiles({exportBytes=false}={}) {
  const files=[],directories=[];
  function walk(directory) {
    directories.push(directory);
    for (const name of module.FS.readdir(directory).filter(name=>name!=='.'&&name!=='..').sort()) {
      const path=directory+'/'+name, stat=module.FS.lstat(path);
      if (module.FS.isLink(stat.mode)) throw new Error('Save inspection encountered a symlink');
      if (module.FS.isDir(stat.mode)) walk(path);
      else if (module.FS.isFile(stat.mode)) {
        files.push(exportBytes?saveFile(path):{path,bytes:stat.size,mtime_ms:Number(stat.mtime)});
      }
    }
  }
  walk('/persist');
  return {root:'/persist',files,directories,scope:'Actual guest FS inspection; not a validated save generation or resume'};
}
function readSourceRange(path,start,length) {
  const entry=vfs.manifest.files.find(file=>file.virtual===path);
  if (!entry||!Number.isSafeInteger(start)||!Number.isSafeInteger(length)||start<0||length<0||length>1048576||start+length>entry.bytes) {
    throw new Error('Original source range must name an indexed file and at most 1 MiB of valid bytes');
  }
  const bytes=new Uint8Array(length), stream=module.FS.open(path,'r');
  let count;
  try {count=module.FS.read(stream,bytes,0,length,start);} finally {module.FS.close(stream);}
  if (count!==length) throw new Error('Actual original FS range was short');
  return {path,start,bytes:count,encoding:'base64',data:base64(bytes),url:entry.url,etag:entry.etag};
}
async function command(id) {
  if (busy||!report.passed) throw new Error('Actual command requires a ready, idle original core');
  busy=true;
  try {
    report.commandDispatchCount++;
    const text=module.ccall('tome_native_command','string',['string'],[id]);
    if (!text) throw new Error(nativeError());
    const result=JSON.parse(text);
    report.commandCount++;
    report.lastCommand={command:result.command,ticks:result.ticks,before:summary(result.before),after:summary(result.after)};
    report.metrics={...vfs.metrics}; status.textContent=JSON.stringify(report.lastCommand,null,2);
    delete report.commandError;
    return {...result,report:structuredClone(report)};
  } catch (error) { report.commandError=error.message; status.textContent=error.message; throw error; }
  finally { busy=false; }
}
async function uiCommand(id) {
  try {await command(id);drawOriginalBaseline();}
  catch (error) {status.textContent=error.message;}
}
window.tomeNativeProbe={command,snapshot:()=>summary(snapshot()),snapshotRaw:snapshot,rngSnapshot,
  drawBaseline:drawOriginalBaseline,saveFiles,saveFile,readSourceRange,report};
for (const button of document.querySelectorAll('[data-command]')) {
  button.disabled=true; button.addEventListener('click',()=>uiCommand(button.dataset.command));
}
const keys={ArrowUp:'MOVE_UP',ArrowDown:'MOVE_DOWN',ArrowLeft:'MOVE_LEFT',ArrowRight:'MOVE_RIGHT',
  Home:'MOVE_LEFT_UP',PageUp:'MOVE_RIGHT_UP',End:'MOVE_LEFT_DOWN',PageDown:'MOVE_RIGHT_DOWN'};
canvas.addEventListener('keydown',event=>{
  if (event.altKey||event.ctrlKey||event.metaKey||event.shiftKey) return;
  const id=event.code==='Numpad5'?'MOVE_STAY':keys[event.key];
  if(id) {event.preventDefault();if(!event.repeat) uiCommand(id);}
});
try {
  module=await nativeFactory({canvas,noInitialRun:true,locateFile:name=>'/native/'+name,print,printErr:print});
  report.phase='vfs'; vfs=await mountOriginalInputs(module);
  report.transport=vfs.transport; report.sourceCommit=vfs.manifest.upstream_commit;
  report.phase='native-init'; status.textContent='原版 SDL / OpenGL を初期化中…';
  if (module.ccall('tome_native_init','number',[],[])!==1) throw new Error(nativeError());
  report.phase='original-loader'; status.textContent='原版のゲームを起動中…';
  if (module.ccall('tome_native_start','number',[],[])!==1) throw new Error(nativeError());
  report.snapshot=summary(snapshot()); report.metrics={...vfs.metrics};
  report.passed=report.snapshot.ready===true&&Number.isFinite(report.snapshot.player?.uid)&&!!report.snapshot.map;
  if (report.passed) drawOriginalBaseline();
  report.phase=report.passed?'real-player-ready':'original-loader-returned'; report.completed=true;
  status.textContent=JSON.stringify(report,null,2);
  for (const button of document.querySelectorAll('[data-command]')) button.disabled=!report.passed;
  canvas.focus();
} catch (error) {
  report.completed=true;report.passed=false;report.error=error.stack||error.message;
  if (vfs) report.metrics={...vfs.metrics}; status.textContent=report.error;
  console.error('TOME_BROWSER_BOOT_FAILURE='+report.error);
}
</script>
</html>
