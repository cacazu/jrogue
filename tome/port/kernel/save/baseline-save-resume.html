<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToME</title>
<style>
body{margin:0;background:#17191d;color:#eee;font:16px system-ui,sans-serif;line-height:1.6}
main{max-width:1280px;margin:auto;padding:12px}h1{font-size:1.15rem;margin:0}
canvas{display:block;width:100%;height:auto;background:black;border:1px solid #555;touch-action:none}
button{font:inherit;min-width:48px;min-height:48px;margin:3px;padding:6px 12px;background:#303744;color:white;border:1px solid #777;border-radius:4px}
#status{overflow-wrap:anywhere}#log{font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:10rem;overflow:auto}
</style>
<main>
<h1 data-text="save.ui.title"></h1><p data-text="save.ui.scope"></p>
<canvas id="game" width="1280" height="720" tabindex="0" aria-label="ToME"></canvas>
<p id="status" role="status"></p>
<div><button id="save" disabled data-text="save.ui.save"></button><button id="resume" disabled data-text="save.ui.resume_button"></button>
<button data-command="MOVE_STAY" disabled data-text="save.ui.wait"></button>
<button data-command="MOVE_RIGHT" disabled>→</button><button data-command="MOVE_LEFT" disabled>←</button></div>
<details><summary data-text="save.ui.diagnostics"></summary><pre id="log"></pre></details>
</main>
<script type="module">
import nativeFactory from '/native/tome-native.mjs';
import {mountOriginalInputs} from '/bootstrap/browser_vfs_mounts.mjs';
import {OriginalCheckpointStore} from '/checkpoint/checkpoint_store.mjs';
import {actualNativeArchiveValidator} from '/checkpoint/native_archive_validator.mjs';
import {saveBaselineCheckpoint,resumeBaselineCheckpoint} from '/checkpoint/baseline_flow.mjs';
const params=new URL(location.href).searchParams,locale=params.get('lang')==='en'?'en':'ja';
const catalog=await(await fetch('/checkpoint/i18n/'+locale+'.json',{cache:'no-store'})).json();
document.documentElement.lang=locale;document.title=catalog['save.ui.title'];
for(const node of document.querySelectorAll('[data-text]'))node.textContent=catalog[node.dataset.text];
const canvas=document.querySelector('#game'),status=document.querySelector('#status'),log=document.querySelector('#log');
const report=window.tomeCheckpointReport={completed:false,passed:false,phase:'factory',mode:'baseline_original_checkpoint',
  document_time_origin:performance.timeOrigin,
  renderer_purity_claim:false,domain_load_equivalence_claim:false,scope:'Actual original full-save and fresh-module durable resume comparison'};
let module,vfs,store,busy=true,lastSave;const lines=[];
const show=id=>status.textContent=catalog[id]||catalog['save.ui.failed'];
function print(value){let line=String(value);const match=line.match(/^(TOME_REAL_[A-Z_]+_JSON)=(.*)$/);if(match){try{const v=JSON.parse(match[2]);line=match[1]+'_SUMMARY='+JSON.stringify({ready:v.ready,turn:v.game?.turn,player:v.game?.player,map:{w:v.game?.level?.map?.w,h:v.game?.level?.map?.h}});}catch{}}console.log(line);lines.push(line.slice(0,2048));if(lines.length>80)lines.shift();log.textContent=lines.join('\n');}
function nativeError(){return module.ccall('tome_native_last_error','string',[],[]);}
function jsonCall(name,args=[]){const value=module.ccall(name,'string',args.map(()=> 'string'),args);if(!value)throw new Error(nativeError());return JSON.parse(value);}
function snapshot(){return jsonCall('tome_native_snapshot');}
function rng(){const value=module.ccall('tome_native_rng_snapshot_hex','string',[],[]);if(!/^[0-9a-f]{5176}$/.test(value||''))throw new Error('save.flow.invalid_baseline_rng');return value;}
function controls(){for(const button of document.querySelectorAll('button'))button.disabled=busy||!report.passed;document.querySelector('#resume').disabled=busy||!report.passed||!store?.verifiedHead;}
async function command(virtual){
  if(busy||!report.passed||module._tome_web_checkpoint_busy())throw new Error('save.flow.command_gate_closed');
  busy=true;controls();try{return jsonCall('tome_native_command',[virtual]);}finally{busy=false;controls();}
}
async function save(){
  if(busy||!report.passed)throw new Error('save.flow.command_gate_closed');
  busy=true;controls();show('save.ui.saving');
  const generation='baseline_'+crypto.randomUUID().replaceAll('-','');
  try{
    lastSave=await saveBaselineCheckpoint(module,store,{generation,onStatus:state=>report.save_operation=state});
    report.last_saved_head=lastSave.durable.head;report.durable=true;show('save.ui.saved');return structuredClone(lastSave);
  }catch(error){report.save_error={id:error.text_id||error.message,detail:error.detail};show('save.ui.failed');throw error;}
  finally{busy=module._tome_web_checkpoint_busy()!==0;controls();}
}
function bytes64(bytes){let encoded='';for(let i=0;i<bytes.length;i+=16384)encoded+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(encoded);}
async function exportGeneration(){
  const verified=await store.latestVerified();if(!verified)throw new Error('save.store.no_valid_generation');
  const graphs={};for(const role of ['game','world']){
    const relative=verified.manifest.graph_paths[role],bytes=module.FS.readFile(verified.base+'/home/'+relative);
    graphs[role]={path:relative,bytes:bytes.length,encoding:'base64',data:bytes64(bytes)};
  }
  return {head:verified.head,manifest:verified.manifest,sidecar:verified.sidecar,graphs};
}
function corruptionRejected(){
  const before=rng();const broken=(before[0]==='0'?'1':'0')+before.slice(1);
  const rejected=module.ccall('tome_web_rng_validate_hex','number',['string','number'],[broken,1])===0;
  return {rejected,unchanged:before===rng(),bytes:2588};
}
async function rejectionProbes(){
  if(busy||!report.passed)throw new Error('save.flow.command_gate_closed');
  busy=true;controls();
  const verified=await store.latestVerified(),FS=module.FS;
  const manifestPath=verified.base+'/manifest.json',manifestBytes=FS.readFile(manifestPath);
  const graphPath=verified.base+'/home/'+verified.manifest.graph_paths.game,graphBytes=FS.readFile(graphPath);
  const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
  const before=rng();let future,corrupt,prior;
  try{
    const altered=structuredClone(verified.manifest);altered.schema=2;
    const alteredBytes=new TextEncoder().encode(JSON.stringify(altered)+'\n');
    FS.writeFile(manifestPath,alteredBytes);
    try{await store.validateHead({...verified.head,manifest_sha256:await hash(alteredBytes)});future={rejected:false};}
    catch(error){future={rejected:true,error:error.text_id||error.message};}
    FS.writeFile(manifestPath,manifestBytes);
    const broken=graphBytes.slice();broken[Math.floor(broken.length/2)]^=1;FS.writeFile(graphPath,broken);
    try{await store.validateHead(verified.head);corrupt={rejected:false};}
    catch(error){corrupt={rejected:true,error:error.text_id||error.message};}
    if(verified.manifest.previous_head){
      const fallback=await store.latestVerified();
      prior={validated:true,generation:fallback.head.generation,expected:verified.manifest.previous_head.generation,
        matched:fallback.head.generation===verified.manifest.previous_head.generation};
    }else prior={validated:false};
  }finally{
    FS.writeFile(manifestPath,manifestBytes);FS.writeFile(graphPath,graphBytes);
    await store.latestVerified();busy=false;controls();
  }
  return {future,corrupt,prior,rng_unchanged:before===rng(),scope:'Actual local FS validation/fallback only; no corrupted bytes persisted and no injected IndexedDB transaction failure'};
}
window.tomeCheckpointProbe={snapshot,rng,command,save,exportGeneration,corruptionRejected,report,
  rejectionProbes,
  nativeBusy:()=>module._tome_web_checkpoint_busy(),resumeURL:()=>{const url=new URL(location.href);url.searchParams.set('resume','1');return url.href;}};
for(const button of document.querySelectorAll('[data-command]'))button.addEventListener('click',()=>command(button.dataset.command).catch(error=>{show('save.ui.failed');print(error.message);}));
document.querySelector('#save').addEventListener('click',()=>save().catch(error=>print(error.message)));
document.querySelector('#resume').addEventListener('click',()=>{location.href=window.tomeCheckpointProbe.resumeURL();});
canvas.addEventListener('keydown',event=>{const key={ArrowRight:'MOVE_RIGHT',ArrowLeft:'MOVE_LEFT',Numpad5:'MOVE_STAY'}[event.code];if(key&&!event.repeat&&!event.ctrlKey&&!event.altKey&&!event.metaKey){event.preventDefault();command(key).catch(error=>print(error.message));}});
try{
  show('save.ui.loading');
  const sources=await(await fetch('/checkpoint/source-manifest.json',{cache:'no-store'})).json();
  module=await nativeFactory({canvas,noInitialRun:true,locateFile:name=>'/native/'+name,print,printErr:print});
  vfs=await mountOriginalInputs(module);
  const compatibility={schema:1,engine:'te4-1.7.6',module:'tome-1.7.6',core_version:17,lua_abi:'5.1.5',target:'wasm32',
    sdk:'6.0.8',libc_rng:'emsdk-musl-rand-v1',upstream_commit:vfs.manifest.upstream_commit,
    source_archive_sha256:vfs.manifest.source_archive_sha256,adapter_sources_sha256:sources.bundle_sha256};
  store=new OriginalCheckpointStore(module,{compatibility,validateOriginalArchives:actualNativeArchiveValidator(module)});
  report.phase='idbfs-populate';await store.initialize();
  const verified=await store.latestVerified();
  if(params.get('resume')==='1'){
    if(!verified)throw new Error('save.store.no_valid_generation');
    report.phase='original-resume';show('save.ui.resume');
    report.resume_result=await resumeBaselineCheckpoint(module,store,{verified,onStatus:state=>report.resume_operation=state});
    report.resumed_head=verified.head;
  }else{
    report.phase='original-birth';
    if(module.ccall('tome_native_init','number',[],[])!==1||module.ccall('tome_native_start','number',[],[])!==1)throw new Error(nativeError());
    if(module.ccall('tome_native_draw_baseline','number',[],[])!==1)throw new Error(nativeError());
  }
  const observed=snapshot();report.snapshot={ready:observed.ready,turn:observed.game?.turn,player:observed.game?.player,
    map:{w:observed.game?.level?.map?.w,h:observed.game?.level?.map?.h}};
  report.metrics={...vfs.metrics};report.passed=observed.ready===true&&!!observed.game?.player&&!!observed.game?.level;
  report.phase=report.passed?'original-player-ready':'original-loader-returned';report.completed=true;busy=false;show('save.ui.ready');controls();canvas.focus();
}catch(error){report.completed=true;report.passed=false;report.phase='failed';report.error=error.stack||error.message;show('save.ui.failed');print(report.error);controls();}
</script>
</html>
