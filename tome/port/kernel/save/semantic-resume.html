<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToME</title>
<style>
body{margin:0;background:#17191d;color:#eee;font:16px system-ui,sans-serif;line-height:1.6}
main{max-width:1280px;margin:auto;padding:12px;box-sizing:border-box;overflow-wrap:anywhere}h1{font-size:1.2rem}
canvas{display:block;width:100%;height:auto;background:black;border:1px solid #555;box-sizing:border-box;touch-action:none}
button{font:inherit;min-width:48px;min-height:48px;padding:8px 14px;background:#303744;color:white;border:1px solid #777;border-radius:4px}
pre{font:12px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:14rem;overflow:auto}
#actual-text{white-space:pre-wrap}
</style>
<main>
<h1 data-text="save.ui.title"></h1><p data-text="save.ui.scope"></p>
<canvas id="original" width="1280" height="720" tabindex="0" aria-label="ToME"></canvas>
<p id="status" role="status"></p><p id="actual-text"></p>
<button id="wait" data-text="save.ui.wait" disabled></button>
<details><summary data-text="save.ui.diagnostics"></summary><pre id="evidence"></pre><pre id="log"></pre></details>
</main>
<script type="module">
import nativeFactory from '/native/tome-native.mjs';
import {mountOriginalInputs} from '/bootstrap/browser_vfs_mounts.mjs';
import {createSemanticTextWasm} from '/semantic/semantic-text-wasm.mjs';
import {installNativeSemanticBridge} from '/semantic/native-semantic-bridge.mjs';
import {OriginalCheckpointStore} from '/checkpoint/checkpoint_store.mjs';
import {actualNativeArchiveValidator} from '/checkpoint/native_archive_validator.mjs';
import {resumeBaselineCheckpoint} from '/checkpoint/baseline_flow.mjs';

const canvas=document.querySelector('#original'),status=document.querySelector('#status'),log=document.querySelector('#log');
const report=window.tomeNativeBootReport={completed:false,passed:false,phase:'semantic-catalogues',
  document_time_origin:performance.timeOrigin,mode:'hydrated_original_checkpoint_with_semantic_text',
  scope:'Actual original full Game/World resume with saved locale hydration and Rust semantic text',
  renderer:'explicit-effectful-original-baseline',renderer_purity_claim:false,complete_game_ui:false,
  complete_campaign_verified:false,lifecycle:[],hydration_hook_calls:0};
let native,resolver,semanticHost,vfs,store,busy=true,catalog,verified;
const calls={},lines=[];
const copy=value=>structuredClone(value);
const fail=id=>{throw Error(id);};
const array=value=>Array.isArray(value)?value:[];
async function jsonFetch(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)fail('source_fetch_'+response.status);return response.json();}
async function bytesFetch(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)fail('source_fetch_'+response.status);return response.arrayBuffer();}
function labels(value){
  catalog=value;document.title=value['save.ui.title'];
  for(const node of document.querySelectorAll('[data-text]'))node.textContent=value[node.dataset.text];
}
function show(id){status.textContent=catalog?.[id]||catalog?.['save.ui.failed']||'';}
function print(value){
  let line=String(value),match=line.match(/^(TOME_REAL_[A-Z_]+_JSON)=(.*)$/);
  if(match){try{const v=JSON.parse(match[2]);line=match[1]+'_SUMMARY='+JSON.stringify({ready:v.ready,turn:v.game?.turn,
    player:v.game?.player,map:{w:v.game?.level?.map?.w,h:v.game?.level?.map?.h}});}catch{}}
  line=line.slice(0,2048);console.log(line);lines.push(line);if(lines.length>80)lines.shift();log.textContent=lines.join('\n');
}
function nativeError(){return native.ccall('tome_native_last_error','string',[],[])||'original_native_call_failed';}
function json(name,args=[]){
  const value=native.ccall(name,'string',args.map(()=> 'string'),args);
  if(typeof value!=='string'||!value)fail(nativeError());return JSON.parse(value);
}
const raw=()=>json('tome_native_snapshot');
const rng=()=>{
  const value=native.ccall('tome_native_rng_snapshot_hex','string',[],[]);
  if(!/^[0-9a-f]{5176}$/.test(value||''))fail('save.flow.invalid_baseline_rng');return value;
};
function localization(){
  const value=json('tome_native_localization');report.localization=value;
  const d=value.diagnostics;
  document.querySelector('#actual-text').textContent=[d?.player?.get_name,d?.player?.translated_subclass,
    ...array(d?.precision?.probes).map(probe=>probe.result)].filter(value=>typeof value==='string').join('\n');
  return value;
}
function controls(){document.querySelector('#wait').disabled=busy||!report.passed;}
function compact(){
  document.querySelector('#evidence').textContent=JSON.stringify({phase:report.phase,passed:report.passed,
    document_time_origin:report.document_time_origin,saved_preferred_locale:report.saved_preferred_locale,
    hydrated_generation:report.resumed_head?.generation,lifecycle:report.lifecycle,
    hydration_hook_calls:report.hydration_hook_calls,semantic_catalogue:report.semanticCatalogue,
    localization_status:report.localization?.status,font:report.localization?.diagnostics?.font,
    player:report.localization?.diagnostics?.player,coverage:report.localization?.coverage?.counters,
    resume_phase:report.resume_operation?.phase,renderer_purity_claim:false,error:report.error},null,2);
}
function draw(){
  if(native._tome_web_checkpoint_busy()!==0)fail('save.flow.command_gate_closed');
  if(native.ccall('tome_native_draw_baseline','number',[],[])!==1)fail(nativeError());
  report.original_visual_frames=(report.original_visual_frames||0)+1;
}
async function command(key){
  if(busy||!report.passed||native._tome_web_checkpoint_busy()!==0)fail('save.flow.command_gate_closed');
  if(!['MOVE_STAY','MOVE_LEFT','MOVE_RIGHT','MOVE_UP','MOVE_DOWN'].includes(key))fail('error.core.request');
  busy=true;controls();
  try{
    const trace=json('tome_native_command',[key]);
    // Match the fresh combined application's accepted command boundary:
    // actual command -> explicit original effectful frame -> fresh observation.
    draw();const snapshot=raw(),fullRng=rng();localization();compact();
    return {command:key,ticks:trace.ticks,snapshot,rng:fullRng,
      scope:'Post-application-frame actual observation; Trace.after is not substituted for it'};
  }finally{busy=native._tome_web_checkpoint_busy()!==0;controls();}
}
function bytes64(bytes){let value='';for(let p=0;p<bytes.length;p+=16384)value+=String.fromCharCode(...bytes.subarray(p,p+16384));return btoa(value);}
async function exportGeneration(){
  if(busy||!report.passed||native._tome_web_checkpoint_busy()!==0)fail('save.flow.command_gate_closed');
  busy=true;controls();
  try{
    const current=await store.latestVerified();if(!current)fail('save.store.no_valid_generation');
    const graphs={};for(const role of ['game','world']){
      const path=current.manifest.graph_paths[role],bytes=native.FS.readFile(current.base+'/home/'+path);
      graphs[role]={path,bytes:bytes.length,encoding:'base64',data:bytes64(bytes)};
    }
    return {head:copy(current.head),manifest:copy(current.manifest),sidecar:copy(current.sidecar),graphs};
  }finally{busy=false;controls();}
}
async function inspect(){
  if(busy||!report.passed||native._tome_web_checkpoint_busy()!==0)fail('save.flow.command_gate_closed');
  busy=true;controls();
  try{
    const current=await store.latestVerified();return {snapshot:raw(),rng:rng(),localization:copy(localization()),
      head:copy(current.head),manifest:copy(current.manifest),sidecar:copy(current.sidecar),calls:{...calls}};
  }finally{busy=false;controls();}
}
function observeDiagnostics(){
  const before=JSON.stringify(raw()),beforeRng=rng(),value=localization(),after=JSON.stringify(raw()),afterRng=rng();
  return {value,preserves_actual_state:before===after,preserves_actual_rng:beforeRng===afterRng,
    observer_telemetry_may_change:true,rng_bytes:beforeRng.length/2};
}

try{
  labels(await jsonFetch('/checkpoint/i18n/ja.json'));show('save.ui.loading');
  const sources=await jsonFetch('/checkpoint/source-manifest.json');
  resolver=await createSemanticTextWasm(await bytesFetch('/semantic/tome_text_wasm.wasm'),{
    english:'/catalog/en.json',japanese:'/catalog/ja.json',registry:'/catalog/registry.json',
    supplements:'/catalog/ja-supplement-complete.json',formatPolicies:'/catalog/format-policy.json',
    extension:'/catalog/dream-registry-extension.json'},{expectedIds:24826});
  if(resolver.status.base_ids!==24825||resolver.status.extension_ids!==1||resolver.status.supplements!==479||resolver.status.format_policies!==2)
    fail('final_reviewed_semantic_coverage_mismatch');
  report.semanticCatalogue=copy(resolver.status);report.phase='native-factory';
  native=await nativeFactory({canvas,noInitialRun:true,locateFile:name=>'/native/'+name,print,printErr:print});
  for(const name of ['tome_native_init','tome_native_set_resume_request','tome_native_start_resume','tome_native_enable_semantic_resume',
    'tome_native_semantic_register','tome_native_localization','tome_native_draw_baseline','tome_native_snapshot','tome_native_command']){
    if(typeof native['_'+name]!=='function')fail('missing_actual_export_'+name);
  }
  const original=native.ccall.bind(native);
  native.ccall=(name,...args)=>{
    calls[name]=(calls[name]||0)+1;
    if(['tome_native_init','tome_native_set_resume_request','tome_native_semantic_register','tome_native_enable_semantic_resume',
      'tome_native_start_resume','tome_native_start','tome_native_enable_semantic_fresh'].includes(name))report.lifecycle.push(name);
    return original(name,...args);
  };
  vfs=await mountOriginalInputs(native);
  const compatibility={schema:1,engine:'te4-1.7.6',module:'tome-1.7.6',core_version:17,lua_abi:'5.1.5',target:'wasm32',
    sdk:'6.0.8',libc_rng:'emsdk-musl-rand-v1',upstream_commit:vfs.manifest.upstream_commit,
    source_archive_sha256:vfs.manifest.source_archive_sha256,adapter_sources_sha256:sources.bundle_sha256};
  store=new OriginalCheckpointStore(native,{compatibility,validateOriginalArchives:actualNativeArchiveValidator(native)});
  report.phase='idbfs-populate';await store.initialize();report.lifecycle.push('actual_IDBFS_store_initialized');
  verified=await store.latestVerified();if(!verified)fail('save.store.no_valid_generation');
  report.saved_preferred_locale=verified.manifest.loader.preferred_locale;
  if(report.saved_preferred_locale==='en_US'){labels(await jsonFetch('/checkpoint/i18n/en.json'));document.documentElement.lang='en';}
  report.phase='original-semantic-resume';show('save.ui.resume');
  report.resume_result=await resumeBaselineCheckpoint(native,store,{verified,
    onStatus:value=>{report.resume_operation=copy(value);compact();},
    beforeOriginalStart:async(module,{request,verified:checked})=>{
      report.hydration_hook_calls++;
      if(report.hydration_hook_calls!==1||module!==native||request.preferred_locale!==checked.manifest.loader.preferred_locale)
        fail('save.resume.hydration_contract_mismatch');
      // The flow alone already initialized the real VM and accepted the real
      // saved request. Install text callbacks here; never initialize/start again.
      semanticHost=installNativeSemanticBridge(module,resolver);
      if(module.ccall('tome_native_enable_semantic_resume','number',['string'],[request.preferred_locale])!==1)fail(nativeError());
      report.hydration={preferred_locale:request.preferred_locale,generation:request.generation,
        hydrated_from_actual_verified_generation:true,enable_fresh_called:false};
    }});
  report.resumed_head=copy(verified.head);
  const observed=raw(),text=localization();
  if(observed.ready!==true||!observed.game?.player||!observed.game?.level||text.enabled!==true||!text.status.installed||
    text.status.locale!==verified.manifest.loader.preferred_locale||
    text.diagnostics?.locale!==verified.manifest.loader.preferred_locale||
    text.status.external_player_names_protected!==true||
    text.diagnostics?.player?.get_name!==observed.game.player.name)fail('actual_semantic_resume_incomplete');
  if(verified.manifest.loader.preferred_locale==='ja_JP'&&(!text.diagnostics?.font?.japanese_package_loaded||
    !text.diagnostics.font.actual_font_exists||!text.diagnostics.font.matches_japanese_package||
    !text.diagnostics.font.break_text_all_character))fail('actual_original_japanese_font_required');
  // Do not add another baseline frame here. The original resume flow already
  // settled one original display and restored the saved RNG afterwards.
  report.snapshot={ready:observed.ready,turn:observed.game.turn,player:copy(observed.game.player),
    map:{w:observed.game.level.map.w,h:observed.game.level.map.h}};
  report.metrics={...vfs.metrics};report.sourceCommit=vfs.manifest.upstream_commit;
  report.passed=true;report.completed=true;report.phase='original-semantic-resume-ready';busy=false;show('save.ui.ready');controls();compact();
  window.tomeSemanticResumeProbe={raw,snapshot:raw,rng,localization,observeDiagnostics,command,inspect,exportGeneration,report,
    calls:()=>({...calls}),generation:()=>store.verifiedHead?.generation||null,
    nativeBusy:()=>native._tome_web_checkpoint_busy(),leases:()=>semanticHost.outstandingLeases(),resolverStatus:()=>copy(resolver.status)};
  document.querySelector('#wait').addEventListener('click',()=>command('MOVE_STAY').catch(error=>{show('save.ui.failed');print(error.message);}));
  canvas.addEventListener('keydown',event=>{
    if(event.code==='Numpad5'&&!event.repeat&&!event.ctrlKey&&!event.altKey&&!event.metaKey&&!event.isComposing){
      event.preventDefault();event.stopImmediatePropagation();command('MOVE_STAY').catch(error=>print(error.message));
    }
  },{capture:true});
  canvas.focus();
}catch(error){report.completed=true;report.passed=false;report.phase='failed';report.error=error.stack||String(error);show('save.ui.failed');print(report.error);controls();compact();}
</script>
</html>
