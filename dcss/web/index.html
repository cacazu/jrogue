<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCSS</title><link rel="stylesheet" href="/web/style.css"></head>
<body data-mode="core"><main>
<header><h1 data-text="app.title">DCSS</h1><select id="language" data-aria-label="adapter.language"><option value="ja">日本語</option><option value="en">English</option></select></header>
<p class="scope" data-text="scope.engine_unavailable"></p>
<section id="character-settings" class="controls" hidden><label><span data-text="adapter.species"></span><select id="species"></select></label><label><span data-text="adapter.job"></span><select id="job"></select></label></section>
<section id="verification-identity" class="controls"><label><span data-text="adapter.player"></span><input id="player" value="Player" maxlength="128" autocomplete="off"></label><label><span data-text="adapter.seed"></span><input id="seed" value="42" inputmode="numeric" pattern="[0-9]+"></label><button id="start" data-text="adapter.start"></button></section>
<section id="verification-tools" class="tools"><button id="sample" data-text="adapter.sample"></button><label><span id="dice-label"></span><input type="number" id="count" min="1" max="1000" value="2"><span aria-hidden="true">d</span><input type="number" id="sides" min="1" max="1000000" value="6"></label><button id="roll" data-text="adapter.roll"></button><button id="save" data-text="adapter.save"></button><button id="load" data-text="adapter.load"></button><button id="export" data-text="adapter.export"></button><label class="button"><span data-text="adapter.import"></span><input id="import" type="file" accept="application/json,.json" hidden></label><button id="help" data-text="adapter.help"></button></section>
<p id="status" role="status" aria-live="polite"></p><pre id="result"></pre>
<section id="core-panel" hidden><div class="console-viewport"><canvas id="console" tabindex="0" data-aria-label="adapter.console"></canvas></div><div id="touch" data-aria-label="adapter.directions"><button data-key="y">↖</button><button data-key="k">↑</button><button data-key="u">↗</button><button data-key="h">←</button><button data-key=".">·</button><button data-key="l">→</button><button data-key="b">↙</button><button data-key="j">↓</button><button data-key="n">↘</button></div><div class="tools"><button data-key="i" data-text="adapter.inventory"></button><button data-key="o" data-text="adapter.explore"></button><button data-key="5" data-text="adapter.rest"></button><button data-key="Enter" data-text="adapter.more"></button><button data-key="Escape" data-text="adapter.cancel"></button><button id="core-save" data-text="adapter.native_save"></button><button id="core-load" data-text="adapter.native_load"></button></div></section>
<section id="semantic-panel" hidden><h2 id="semantic-heading"></h2><ol id="semantic-messages"></ol><p id="semantic-announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p></section>
<details id="help-panel"><summary data-text="adapter.help"></summary><p data-text="help.verification"></p><p data-text="help.keyboard"></p><p data-text="help.save"></p></details>
<footer>Dungeon Crawl Stone Soup 0.34.1 · <a href="https://github.com/crawl/crawl/tree/1eebc1a2892e1c89776a0d7a10691f8dac8d9796">upstream</a> · <a href="/web/notices.html" data-text="adapter.licenses"></a></footer>
</main><script type="module" src="/web/app.mjs"></script></body></html>
