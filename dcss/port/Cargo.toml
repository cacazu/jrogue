[package]
name = "dcss-boundary"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = 2
lto = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
