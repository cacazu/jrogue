[package]
name = "angband-layers"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust presentation, input, and platform boundaries for original Angband 4.2.6 logic"
license = "GPL-2.0-only"
publish = false

[lib]
name = "angband_layers"
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 2
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
