<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Angband</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div><h1>Angband <small id="build-version"></small></h1><p class="migration" data-i18n="migration.status"></p></div>
      <label class="language"><span data-i18n="settings.language"></span><select id="language"><option value="ja">日本語</option><option value="en">English</option></select></label>
    </header>
    <section class="session-controls" aria-label="Session" data-i18n-aria="session.controls">
      <label><span data-i18n="session.seed"></span><input id="seed" type="number" inputmode="numeric" min="0" max="4294967295" step="1" value="1"></label>
      <button id="new-game" disabled data-i18n="session.new"></button>
      <button id="resume" disabled data-i18n="session.resume"></button>
      <button id="save" disabled data-i18n="session.save"></button>
      <label class="font-size"><span data-i18n="settings.font_size"></span><select id="font-size"><option value="12" data-i18n="settings.font_small"></option><option value="16" selected data-i18n="settings.font_normal"></option><option value="20" data-i18n="settings.font_large"></option></select></label>
    </section>
    <div class="status-row"><p id="status" role="status" aria-live="polite"></p><p id="game-state"></p></div>
    <div id="terminal-viewport" class="terminal-viewport">
      <canvas id="terminal" tabindex="0" width="1000" height="608" aria-label="Angband terminal" data-i18n-aria="terminal.label" aria-describedby="keyboard-help"></canvas>
    </div>
    <p id="keyboard-help" class="hint" data-i18n="help.keyboard"></p>
    <div class="message-log" id="localized-log" role="log" aria-live="polite"></div>
    <p id="message-coverage" class="hint"></p>
    <section class="semantic-view" aria-labelledby="semantic-title">
      <h2 id="semantic-title" data-i18n="semantic.title"></h2>
      <div id="semantic-panels" class="semantic-panels"></div>
    </section>
    <section class="touch-controls" data-i18n-aria="controls.touch" aria-label="Game controls">
      <div class="direction-pad" role="group" data-i18n-aria="controls.move" aria-label="Move">
        <button data-code="55" data-i18n-title="move.northwest" aria-label="Northwest" data-i18n-aria="move.northwest">↖</button>
        <button data-code="56" data-i18n-title="move.north" aria-label="North" data-i18n-aria="move.north">↑</button>
        <button data-code="57" data-i18n-title="move.northeast" aria-label="Northeast" data-i18n-aria="move.northeast">↗</button>
        <button data-code="52" data-i18n-title="move.west" aria-label="West" data-i18n-aria="move.west">←</button>
        <button data-code="44" data-i18n-title="command.wait" aria-label="Wait" data-i18n-aria="command.wait">·</button>
        <button data-code="54" data-i18n-title="move.east" aria-label="East" data-i18n-aria="move.east">→</button>
        <button data-code="49" data-i18n-title="move.southwest" aria-label="Southwest" data-i18n-aria="move.southwest">↙</button>
        <button data-code="50" data-i18n-title="move.south" aria-label="South" data-i18n-aria="move.south">↓</button>
        <button data-code="51" data-i18n-title="move.southeast" aria-label="Southeast" data-i18n-aria="move.southeast">↘</button>
      </div>
      <div class="action-pad">
        <button data-code="105" data-i18n="command.inventory"></button>
        <button data-code="101" data-i18n="command.equipment"></button>
        <button data-code="111" data-i18n="command.open"></button>
        <button data-code="60" data-i18n="command.upstairs"></button>
        <button data-code="62" data-i18n="command.downstairs"></button>
        <button data-code="57344" id="escape-key" data-i18n="command.escape"></button>
        <button data-code="156" data-i18n="command.enter"></button>
        <button data-code="32" data-i18n="command.space"></button>
        <button data-code="63" data-i18n="command.help"></button>
        <button data-code="109" data-i18n="command.magic"></button>
        <button data-code="113" data-i18n="command.quaff"></button>
        <button data-code="114" data-i18n="command.read"></button>
      </div>
    </section>
    <form id="text-entry" class="text-entry" autocomplete="off">
      <label for="game-text" data-i18n="input.text"></label>
        <input id="game-text" maxlength="65536" autocapitalize="off" spellcheck="false" aria-describedby="text-help">
      <button type="submit" data-i18n="input.send"></button>
      <span id="text-help" class="hint" data-i18n="input.help"></span>
    </form>
    <details class="secondary"><summary data-i18n="save.manage"></summary><div class="save-tools">
      <button id="export-save" disabled data-i18n="save.export"></button>
      <label class="file-button"><span data-i18n="save.import"></span><input id="import-save" type="file" accept=".json,application/json"></label>
      <p id="save-info"></p><p class="hint" data-i18n="save.help"></p>
    </div></details>
    <details class="secondary"><summary data-i18n="terminal.text_view"></summary><pre id="terminal-text" tabindex="0"></pre></details>
    <footer><a href="https://github.com/angband/angband/tree/4.2.6" target="_blank" rel="noopener" data-i18n="source.upstream"></a><a href="../source.zip" download data-i18n="source.modified"></a><span id="source-commit"></span></footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
