[package]
name = "cdda-source-literal-catalog-verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-SA-3.0"
publish = false
description = "Isolated tests of prepared source-bound literals with the actual Rust catalog consumer"
autobins = false
autolib = false

# Standalone test workspace: do not alter rust-contracts workspace membership.
[workspace]
resolver = "2"

[dev-dependencies]
cdda-logic-contract = { path = "../../rust-contracts/logic" }
cdda-presentation = { path = "../../rust-contracts/presentation" }
serde_json = "=1.0.151"

[[test]]
name = "catalog"
path = "tests/catalog.rs"

[lints.rust]
unsafe_code = "forbid"
