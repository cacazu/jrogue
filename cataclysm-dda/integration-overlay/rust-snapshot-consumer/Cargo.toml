[package]
name = "cdda-live-input-snapshot-consumer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-SA-3.0"
publish = false
description = "Owned observation-only consumer for the retained C++ engine input snapshot"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"
suspicious = "warn"

[workspace]

