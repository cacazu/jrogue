[package]
name = "cdda-rust-browser-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-SA-3.0"
publish = false
description = "Bounded browser input and semantic shell formatting for the retained C++ engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cdda-input = { path = "../rust-contracts/input" }
cdda-logic-contract = { path = "../rust-contracts/logic" }
cdda-presentation = { path = "../rust-contracts/presentation" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
