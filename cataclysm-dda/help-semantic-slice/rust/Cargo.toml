[package]
name = "cdda-help-semantic-slice"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-SA-3.0"
publish = false
description = "Uncompiled source-bound CDDA Movement help presentation preparation"

[workspace]

[dependencies]
cdda-logic-contract = { path = "../../rust-contracts/logic" }
cdda-presentation = { path = "../../rust-contracts/presentation" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"
