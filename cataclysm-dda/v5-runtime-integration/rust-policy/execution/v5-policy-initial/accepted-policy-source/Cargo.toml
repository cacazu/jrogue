[package]
name = "cdda-v5-platform-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-SA-3.0"
publish = false
description = "Pure identity and new-profile policy for the retained C++ engine's local v5 tileset"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
