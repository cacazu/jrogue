<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cataclysm: DDA — ローカル検証</title>
  <link rel="stylesheet" href="baseline.css">
  <link rel="icon" href="favicon.ico">
  <script defer src="baseline-shell.js"></script>
</head>
<body>
  <header>
    <span data-text="baseline.title">Cataclysm: DDA — ローカル検証</span>
    <nav aria-label="ブラウザー操作" data-aria="browser.controls">
      <button id="fullscreen" data-text="browser.fullscreen">全画面</button>
      <button id="export-saves" data-text="browser.export_saves" disabled>保存ファイルを書き出す</button>
      <select id="shell-language" aria-label="ブラウザー表示言語" data-aria="browser.language">
        <option value="ja">日本語</option><option value="en">English</option>
      </select>
    </nav>
  </header>
  <main id="stage">
    <canvas id="canvas" tabindex="0" aria-label="ゲーム画面" data-aria="game.canvas"></canvas>
    <div id="loading" role="status" aria-live="polite" data-text="runtime.loading">読み込み中…</div>
  </main>
  <section id="view-controls" aria-label="ゲーム画面" data-aria="game.canvas">
    <span data-text="game.canvas">ゲーム画面</span>
    <button id="view-fit"><span class="sr-only" data-text="game.canvas">ゲーム画面</span>↔</button>
    <input id="view-scale" type="range" min="25" max="150" step="5" value="75" aria-label="ゲーム画面" data-aria="game.canvas">
    <output id="view-scale-value" for="view-scale">75%</output>
    <button data-pan="left" aria-label="左" data-aria="input.left">←</button>
    <button data-pan="up" aria-label="上" data-aria="input.up">↑</button>
    <button data-pan="down" aria-label="下" data-aria="input.down">↓</button>
    <button data-pan="right" aria-label="右" data-aria="input.right">→</button>
  </section>
  <section id="touch-controls" aria-label="入力補助" data-aria="input.controls">
    <button data-key="ArrowLeft" aria-label="左" data-aria="input.left">←</button>
    <button data-key="ArrowUp" aria-label="上" data-aria="input.up">↑</button>
    <button data-key="ArrowDown" aria-label="下" data-aria="input.down">↓</button>
    <button data-key="ArrowRight" aria-label="右" data-aria="input.right">→</button>
    <button data-key="Enter" data-text="input.enter">決定</button>
    <button data-key="Escape" data-text="input.escape">戻る</button>
    <button data-key="Tab" data-text="input.tab">タブ</button>
    <button data-key="." data-text="input.wait">待機</button>
    <form id="text-input-form">
      <input id="text-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="キー入力" data-aria="input.text">
      <button type="submit" data-text="input.send">入力</button>
    </form>
  </section>
  <footer>
    <span data-text="baseline.notice">元の C++ エンジンのローカル検証用です。音声は無効です。</span>
    <a href="attribution.html" target="_blank" rel="noopener" data-text="browser.attribution">ライセンスと出典</a>
    <details id="diagnostics"><summary data-text="browser.diagnostics">診断</summary><pre id="diagnostic-output"></pre></details>
  </footer>
</body>
</html>
