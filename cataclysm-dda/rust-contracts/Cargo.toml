[workspace]
members = ["logic", "input", "presentation", "platform"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-SA-3.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
cdda-logic-contract = { path = "logic" }
cdda-input = { path = "input" }
cdda-presentation = { path = "presentation" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"

