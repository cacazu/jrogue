[package]
name = "cdda-damage-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-SA-3.0"
description = "Bounded deterministic migration of Cataclysm: DDA 0.I damage arithmetic"
repository = "https://github.com/cacazu/jrogue"

[lib]
path = "src/lib.rs"

[[bin]]
name = "damage-vectors"
path = "src/bin/damage_vectors.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"

