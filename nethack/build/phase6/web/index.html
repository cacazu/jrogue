<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141d21">
  <title>NetHack 5.0.0</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header class="masthead">
      <div class="brand"><span class="mark" aria-hidden="true">@</span><div><h1 data-text-id="ui.title">NetHack</h1><p data-text-id="ui.subtitle"></p></div><span class="version">5.0.0</span></div>
      <label class="locale-label"><span data-text-id="ui.language"></span><select id="locale"><option value="ja">日本語</option><option value="en">English</option></select></label>
    </header>
    <p class="translation-notice" data-text-id="ui.translation_notice"></p>
    <nav class="toolbar" aria-label="Game">
      <button id="start" class="primary" data-text-id="ui.start"></button>
      <button id="restore" data-text-id="ui.restore"></button>
      <button id="save" data-text-id="ui.save" disabled></button>
      <button id="history" data-text-id="ui.history"></button>
      <label class="tutorial-toggle"><input id="tutorial" type="checkbox"><span data-text-id="ui.tutorial"></span></label>
      <details class="save-tools"><summary data-text-id="ui.controls"></summary><div><button id="export" data-text-id="ui.export"></button><label class="file-button"><span data-text-id="ui.import"></span><input id="import" type="file" accept="application/json,.json"></label></div></details>
    </nav>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
    <section class="game-panel" aria-label="NetHack">
      <div class="panel-bar"><span class="dot"></span><span id="game-state" data-text-id="ui.loading"></span><span class="panel-right">ASCII · 80 × 21</span></div>
      <div id="status" class="status" role="status"></div>
      <div id="map-viewport" class="map-viewport"><canvas id="canvas" tabindex="0" width="1185" height="567" aria-label="NetHack dungeon map"></canvas></div>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    </section>
    <section class="input-panel">
      <div class="direction-group"><div id="touch-directions" class="directions"></div><label class="run-toggle"><input type="checkbox" id="run-mode"><span data-text-id="ui.run"></span></label></div>
      <div class="action-group"><p class="hint" data-text-id="ui.keyboard_hint"></p><div id="touch-actions" class="actions"></div><form id="raw-form"><label for="raw-command" data-text-id="ui.raw_command"></label><input id="raw-command" autocomplete="off" spellcheck="false" maxlength="256"><button type="submit" data-text-id="ui.send"></button></form><p class="hint mobile-hint" data-text-id="ui.touch_hint"></p></div>
    </section>
    <footer><details><summary data-text-id="ui.save_notice"></summary><p>NetHack © 1985–2026. <a href="./downloads/corresponding-source.tar.gz" data-text-id="ui.source"></a> · <a href="./downloads/NGPL.txt" data-text-id="ui.license"></a></p></details></footer>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2></header><div id="modal-body"></div><div id="modal-actions"></div></dialog>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
