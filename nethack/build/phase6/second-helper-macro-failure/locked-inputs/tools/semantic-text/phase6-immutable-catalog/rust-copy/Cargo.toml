[package]
name = "nethack-layers"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Pure presentation, command, and platform boundaries for official NetHack"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = 1
panic = "abort"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

