<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DRL 移植検証</title>
<link rel="stylesheet" href="style.css">
<body>
<main>
  <header><h1 data-text="lab.title">DRL 移植検証</h1><label><span data-text="lab.language">言語</span><select id="language"><option value="ja">日本語</option><option value="en">English</option></select></label></header>
  <p data-text="lab.scope">乱数・数値ルール・入力・保存の検証用です。キャンペーンの移植は進行中です。</p>
  <p class="scope" data-text="lab.not_game">この検証画面では DRL のキャンペーンは動作しません。</p>
  <section class="controls" aria-label="乱数検証">
    <label><span data-text="lab.seed">シード</span><input id="seed" type="number" min="0" max="4294967295" value="5489"></label>
    <button id="reset" data-text="lab.reset">乱数を初期化</button>
    <button id="draw" data-text="lab.draw">32ビット値を取得</button>
    <button id="dice" data-text="lab.dice">2d4 を振る</button>
    <button id="redraw" data-text="lab.redraw">再描画</button>
    <button id="save" data-text="lab.save">検証状態を保存</button>
    <button id="resume" data-text="lab.resume">検証状態を再開</button>
  </section>
  <section id="surface" tabindex="0" aria-label="キーボード入力の検証">
    <div class="readings"><output id="value">—</output><output id="count">—</output></div>
    <canvas id="state" aria-label="MT19937 状態の読み取り専用表示"></canvas>
    <output id="command">—</output>
    <div class="directions" aria-label="タッチ方向入力">
      <button data-key="Home" aria-label="左上">↖</button><button data-key="ArrowUp" aria-label="上">↑</button><button data-key="PageUp" aria-label="右上">↗</button>
      <button data-key="ArrowLeft" aria-label="左">←</button><button data-key="w" aria-label="待機">·</button><button data-key="ArrowRight" aria-label="右">→</button>
      <button data-key="End" aria-label="左下">↙</button><button data-key="ArrowDown" aria-label="下">↓</button><button data-key="PageDown" aria-label="右下">↘</button>
    </div>
  </section>
  <p id="status" role="status"></p>
  <footer><span data-text="lab.source">出典：DRL 0.10.11a</span> · <a href="https://github.com/chaosforgeorg/drl/releases/tag/0_10_11a">ChaosForge</a> · <a href="licenses/GPL-2.0.txt">GPL 2.0</a> · <a href="source.zip">検証版ソース</a></footer>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
