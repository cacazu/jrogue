[package]
name = "drl-web-port"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Audited incremental DRL 0.10.11a Rust migration"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
